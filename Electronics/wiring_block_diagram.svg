<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
  <title id="title">NODI revision A electrical power and signal architecture</title>
  <desc id="desc">Dedicated 5 volt 3 amp USB adapter, fuse and star distribution power two servos directly. A separate external diode powers Pico VSYS without feeding USB or servos from the computer. Pico 3.3 volt rail powers OLED and RTC. AHCT125 buffers servo PWM. Button and piezo provide interaction.</desc>
  <defs>
    <marker id="power" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cb6545"/></marker>
    <marker id="signal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#327d88"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1f3444} .heading{font-size:31px;font-weight:700}.sub{font-size:18px;fill:#5b7080}.name{font-size:22px;font-weight:700}.detail{font-size:17px}.label{font-size:16px;font-weight:700}.small{font-size:15px}.box{fill:#f2f7f8;stroke:#c2d1d6;stroke-width:2;rx:14}.logic{fill:#e5f2f2;stroke:#5b9da3;stroke-width:2;rx:14}.p{stroke:#cb6545;stroke-width:4;fill:none;marker-end:url(#power)}.s{stroke:#327d88;stroke-width:3;fill:none;marker-end:url(#signal)}.rail{stroke:#cb6545;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1500" height="1010" fill="#fff"/>
  <text x="50" y="44" class="heading">NODI / power and signal architecture</text>
  <text x="50" y="73" class="sub">Revision A · block-level wiring · no physical electrical testing performed</text>

  <rect x="50" y="110" width="275" height="115" class="box"/>
  <text x="70" y="144" class="name">USB adapter</text>
  <text x="70" y="173" class="detail">5.0–5.1 V / 3 A rated</text>
  <text x="70" y="198" class="small">Dedicated source + rated pigtail</text>
  <path d="M325 166H390" class="p"/>

  <rect x="390" y="110" width="235" height="115" class="box"/>
  <text x="410" y="144" class="name">F1 / input fuse</text>
  <text x="410" y="173" class="detail">2.5 A time-delay</text>
  <text x="410" y="198" class="small">Insulated holder · ≥32 V DC</text>
  <path d="M625 166H700" class="p"/>

  <rect x="700" y="110" width="290" height="115" class="box"/>
  <text x="720" y="144" class="name">Star distribution</text>
  <text x="720" y="173" class="detail">+5 V rail / common ground</text>
  <text x="720" y="198" class="small">1000 µF / 10 V + 100 nF</text>
  <path d="M990 166H1100" class="p"/>

  <rect x="1100" y="110" width="350" height="115" class="box"/>
  <text x="1120" y="144" class="name">2 × MG90S servos</text>
  <text x="1120" y="173" class="detail">Yaw ±30° · pitch −15°/+25°</text>
  <text x="1120" y="198" class="small">Own supply + return conductors</text>

  <path d="M845 225V300" class="p"/>
  <rect x="700" y="300" width="290" height="105" class="box"/>
  <text x="720" y="334" class="name">D1 / 1N5819 diode</text>
  <text x="720" y="363" class="detail">Anode: rail → cathode: VSYS</text>
  <text x="720" y="387" class="small">External supply isolation</text>
  <path d="M845 405V490" class="p"/>
  <text x="860" y="449" class="label">VSYS / pin 39</text>

  <path d="M990 200H1035V353H1100" class="p"/>
  <rect x="1100" y="300" width="350" height="105" class="logic"/>
  <text x="1120" y="334" class="name">SN74AHCT125</text>
  <text x="1120" y="363" class="detail">3.3 V inputs → 5 V PWM</text>
  <text x="1120" y="387" class="small">100 nF at VCC · /OE to GND</text>
  <path d="M1275 300V225" class="s"/>
  <text x="1288" y="263" class="label">220 Ω series</text>

  <rect x="390" y="300" width="235" height="105" class="box"/>
  <text x="410" y="334" class="name">Computer USB</text>
  <text x="410" y="363" class="detail">Programming / settings</text>
  <text x="410" y="387" class="small">Pico onboard diode isolates</text>
  <path d="M508 405V460H730V490" class="s"/>

  <rect x="700" y="490" width="290" height="175" class="logic"/>
  <text x="720" y="525" class="name">Raspberry Pi Pico</text>
  <text x="720" y="555" class="detail">GP2 / GP3 → servo PWM</text>
  <text x="720" y="582" class="detail">GP4 / GP5 → I²C, 100 kHz</text>
  <text x="720" y="609" class="detail">GP15 ← button · GP16 → tone</text>
  <text x="720" y="640" class="small">3V3 OUT powers display + RTC</text>
  <path d="M990 532H1065V380H1100" class="s"/>
  <text x="1004" y="475" class="label">PWM</text>

  <rect x="1100" y="490" width="350" height="115" class="logic"/>
  <text x="1120" y="524" class="name">OLED / Adafruit 938</text>
  <text x="1120" y="553" class="detail">128 × 64 · 0x3C or 0x3D</text>
  <text x="1120" y="579" class="small">VIN = 3.3 V · SDA + SCL + GND</text>
  <path d="M990 578H1100" class="s"/>

  <rect x="1100" y="670" width="350" height="110" class="logic"/>
  <text x="1120" y="704" class="name">RTC / Adafruit 3013</text>
  <text x="1120" y="733" class="detail">DS3231 · I²C 0x68</text>
  <text x="1120" y="758" class="small">3.3 V VIN · CR1220 time backup</text>
  <path d="M990 620H1040V725H1100" class="s"/>

  <rect x="50" y="490" width="275" height="115" class="box"/>
  <text x="70" y="524" class="name">Snooze / dismiss</text>
  <text x="70" y="553" class="detail">Normally open switch to GND</text>
  <text x="70" y="579" class="small">Pullup · 30 ms debounce</text>
  <path d="M325 547H700" class="s"/>
  <text x="413" y="535" class="label">GP15 / pin 20</text>

  <rect x="50" y="670" width="550" height="110" class="box"/>
  <text x="70" y="704" class="name">4 kHz piezo / transistor driver</text>
  <text x="70" y="733" class="detail">GP16 → 4.7 kΩ → 2N3904 base</text>
  <text x="70" y="758" class="small">Piezo from +5 V to collector; 1 kΩ across piezo; emitter GND</text>
  <path d="M775 665V725H600" class="s"/>

  <rect x="50" y="824" width="1400" height="141" fill="#f9f2ed" rx="12"/>
  <text x="72" y="855" class="label">BUILD NOTES</text>
  <text x="72" y="883" class="detail">All grounds common; give motors separate returns. External +5 V must never connect to Pico VBUS / pin 40.</text>
  <text x="72" y="909" class="detail">A USB-C sink pigtail requires separate CC1/CC2 Rd resistors; use only a known 3 A source. No current negotiation circuit is provided.</text>
  <text x="72" y="935" class="detail">Current allowance: 2 × 1.0 A servos + 0.20 A logic = 2.20 A estimate. Measure actual current and rail droop before motion.</text>
  <text x="50" y="993" class="small">Power: terracotta arrows · logic: teal arrows · detailed pinout, passive values and commissioning steps: Electronics/architecture.md</text>
</svg>
